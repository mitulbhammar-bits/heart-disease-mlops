services:
  heart-api:
    build: .
    image: heart-risk-api:1.0.0
    ports: ["8000:8000"]
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [heart-api]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD before starting}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/heart_api_dashboard.json:/var/lib/grafana/dashboards/heart_api_dashboard.json:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
